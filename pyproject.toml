[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-quota-guard"
version = "0.1.0"
description = "Global YouTube Data API quota accountant for a fleet of scripts sharing one Google Cloud project."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Joe Petrucelli", email = "backroadcreativeco@gmail.com" }]
keywords = ["youtube", "youtube-data-api", "quota", "rate-limit", "google-api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["filelock>=3.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_quota_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
